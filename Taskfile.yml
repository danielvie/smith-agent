version: '3'

tasks:
  default:
    desc: List available tasks
    cmds:
      - task --list
    silent: true

  init:
    desc: Install the locked npm dependencies
    cmds:
      - npm ci

  run:
    desc: Run the Smith Agent CLI in the current directory
    interactive: true
    cmds:
      - pnpm run run

  run:exe:
    desc: Run the Windows standalone executable
    interactive: true
    cmds:
      - ./dist/smith-windows-x64.exe

  ui:
    desc: Start the local browser UI from source
    interactive: true
    cmds:
      - npm run ui

  tui:
    desc: Start the terminal interface from source
    interactive: true
    cmds:
      - npm run tui

  ui:verify:
    desc: Render the real UI against a scripted event stream without a model call
    interactive: true
    cmds:
      - npm run ui:verify

  ui:build:
    desc: Build the browser UI
    cmds:
      - npm run ui:build

  ui:check:
    desc: Verify Tailwind generates the committed UI CSS
    cmds:
      - npm run ui:check

  test:
    desc: Run the automated tests
    cmds:
      - npm test

  check:
    desc: Type-check the TypeScript sources
    cmds:
      - npm run check

  build:windows:
    desc: Build and smoke-test the Windows x64 Node SEA executable
    cmds:
      - npm run build:windows

  test:sea:
    desc: Smoke-test the built Windows x64 executable
    cmds:
      - npm run test:sea

  clean:
    desc: Remove build artifacts and dependencies
    cmds:
      - >-
        node -e "import { rm } from 'node:fs/promises'; await rm('dist', { recursive: true, force: true }); await rm('node_modules', { recursive: true, force: true });"
