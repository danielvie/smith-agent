version: '3'

tasks:
  default:
    desc: List available tasks
    cmds:
      - task --list
    silent: true


  init:
    desc: Init the Smith Agent CLI in the current directory
    interactive: true
    cmds:
      - pnpm install --frozen-lockfile --registry=https://registry.npmjs.org --ignore-scripts

  run:
    desc: Run the Smith Agent CLI in the current directory
    interactive: true
    cmds:
      - pnpm run run

  ui:
    desc: Start the local browser UI
    interactive: true
    cmds:
      - pnpm run ui

  ui:verify:
    desc: Render the real UI against a scripted event stream (no agent, no API key)
    interactive: true
    cmds:
      - pnpm run ui:verify

  ui:build:
    desc: Generate Tailwind CSS and build the browser UI
    cmds:
      - pnpm run ui:build

  ui:check:
    desc: Verify Tailwind generates the production UI utilities
    cmds:
      - pnpm run ui:check


  test:
    desc: Run the automated tests
    cmds:
      - pnpm run test

  check:
    desc: Type-check the TypeScript sources
    cmds:
      - pnpm run check

  build:windows:
    desc: Build the Windows x64 standalone executable
    cmds:
      - pnpm run build:windows

  build:targets:
    desc: Build the current target artifacts for Windows, Linux, and macOS ARM64
    cmds:
      - pnpm run build:targets

  clean:
    desc: Remove build artifacts and dependencies
    cmds:
      - >-
        node -e "import { rm } from 'node:fs/promises'; await rm('dist', { recursive: true, force: true }); await rm('node_modules', { recursive: true, force: true }); await rm('pnpm-lock.yaml', { force: true });"
